# apps/web on charts/service, staging namespace. Consumed by .github/workflows/deploy-staging.yml.
replicaCount: 2
service:
  port: 3000
probes:
  liveness: { path: /api/health, initialDelaySeconds: 5, periodSeconds: 10 }
  readiness: { path: /api/health, initialDelaySeconds: 5, periodSeconds: 5 }
  startup: { path: /api/health, failureThreshold: 30, periodSeconds: 2 }
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 512Mi }
env:
  - name: NEXT_PUBLIC_SITE_URL
    value: https://staging.ethanel.example
